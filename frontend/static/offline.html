<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030712" />
    <title>Offline — OpenCW</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #030712;
        color: #f9fafb;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
      }
      .icon {
        color: #10b981;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 0.75rem;
      }
      p {
        color: #94a3b8;
        margin: 0 0 1.75rem;
        line-height: 1.6;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #ffffff;
        background-color: #22c55e;
        cursor: pointer;
        transition: background-color 150ms;
      }
      button:hover {
        background-color: #4ade80;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="icon" width="64" height="64" viewBox="0 0 1024 1024" fill="none" aria-hidden="true">
        <g transform="translate(512 512)" fill="currentColor">
          <circle cx="-180" cy="-110" r="72" />
          <rect x="-70" y="38" width="420" height="144" rx="72" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>This page isn't available offline yet. Reconnect and try again, or check out pages you've visited before.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
