server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit writes pages as `.html` files (trailingSlash: 'never'), so
    # `/de/about` lives at `/de/about.html`. The extension variants come first
    # so `/en` always resolves to `en.html` and never to the sibling `en/`
    # directory that holds the nested pages.
    location / {
        try_files $uri.html $uri/index.html $uri =404;
    }

    # Fingerprinted build assets never change — cache them forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The adapter-static fallback shell renders the SvelteKit error page for
    # unknown URLs; nginx keeps the 404 status code.
    error_page 404 /404.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
